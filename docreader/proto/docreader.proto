syntax = "proto3";

package docreader;

option go_package = "github.com/magicyuan876/yuheng/internal/docreader/proto";

service DocReader {
  rpc Read(ReadRequest) returns (ReadResponse) {}
  // ReadStream is the streaming counterpart of Read. It first emits one
  // ReadStreamResponse carrying the parse metadata (markdown / metadata /
  // error), then emits one message per image. This keeps every gRPC message
  // small so large scanned PDFs (hundreds of page images, far exceeding the
  // unary message-size cap) can be returned without RESOURCE_EXHAUSTED and
  // with bounded memory on both ends.
  rpc ReadStream(ReadRequest) returns (stream ReadStreamResponse) {}
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse) {}
}

message ReadConfig {
  string parser_engine = 1;
  map<string, string> parser_engine_overrides = 2;
  // image_storage removed: image persistence is now handled entirely by the Go App.
  // Field number 3 is reserved for backward compatibility.
  reserved 3;
}

// Unified read request: set file_content for file mode, url for URL mode.
// file_path is a shared-volume alternative to file_content for large media
// (e.g. multi-GB videos): the Go app passes a path inside the volume both
// containers mount instead of streaming the bytes through gRPC memory.
message ReadRequest {
  bytes  file_content = 1;
  string file_name = 2;
  string file_type = 3;
  string url = 4;
  string title = 5;
  ReadConfig config = 6;
  string request_id = 7;
  string file_path = 8;
}

message ImageRef {
  string filename = 1;
  string original_ref = 2;
  string mime_type = 3;
  string storage_key = 4;    // download URL from shared storage
  bytes  image_data = 5;     // inline bytes fallback
  // Timestamp of this frame within the source media, in milliseconds.
  // Set for video keyframes; 0 for ordinary document images.
  int64  timestamp_ms = 6;
}

// MediaInfo describes the audio/video characteristics of a parsed media
// file. Present only when the parsed file is a video.
message MediaInfo {
  bool   is_video = 1;
  int64  duration_ms = 2;
  bool   has_audio = 3;
  string audio_mime_type = 4;  // MIME of the extracted audio track (e.g. audio/mpeg)
  int32  width = 5;
  int32  height = 6;
}

message ReadResponse {
  string markdown_content = 1;
  repeated ImageRef image_refs = 2;
  string image_dir_path = 3;
  map<string, string> metadata = 4;
  string error = 5;
  MediaInfo media = 6;
  // Extracted audio track for ASR (unary fallback only — capped by the gRPC
  // message-size limit; the streaming RPC sends the track as AudioChunk frames).
  bytes audio_data = 7;
}

// Metadata header for a streamed read. Sent exactly once, before any image.
message ReadStreamMeta {
  string markdown_content = 1;
  string image_dir_path = 2;
  map<string, string> metadata = 3;
  string error = 4;
  uint32 image_count = 5; // best-effort total image count (0 if unknown)
  MediaInfo media = 6;
}

// AudioChunk carries one transport slice of the extracted audio track.
// Slices arrive in order after the meta frame and before image frames.
// The track is split into fixed-duration SEGMENTS (so ASR providers with
// small payload caps and no timestamp support still yield a usable
// timeline); slices belonging to the same segment share segment_index /
// start_ms / end_ms and are concatenated by the client in arrival order.
message AudioChunk {
  bytes  data = 1;
  uint32 segment_index = 2;
  int64  start_ms = 3;
  int64  end_ms = 4;
}

// One frame of a ReadStream. The first frame carries `meta`; subsequent
// frames carry audio slices (for videos with an audio track) and then one
// frame per image.
message ReadStreamResponse {
  oneof payload {
    ReadStreamMeta meta = 1;
    ImageRef image = 2;
    AudioChunk audio = 3;
  }
}

message ListEnginesRequest {
  map<string, string> config_overrides = 1;
}

message ParserEngineInfo {
  string name = 1;
  string description = 2;
  repeated string file_types = 3;
  bool available = 4;
  string unavailable_reason = 5;
}

message ListEnginesResponse {
  repeated ParserEngineInfo engines = 1;
}
