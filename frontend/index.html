<!doctype html>
<html lang="en">
  <head>
    <title>Yuheng 知识库</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="keywords" content="知识问答、知识库、智能问答、语义检索、文档理解、企业知识管理" />
    <meta
      name="description"
      content="Yuheng 知识库——基于大语言模型的文档理解与语义检索平台，面向结构复杂、内容异构的企业文档场景。"
    />
    <link rel="shortcut icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="apple-touch-icon" sizes="120x120" type="image/svg+xml" href="./public/favicon.svg" />
  </head>
  <body>
    <script>
      (function () {
        var t = localStorage.getItem("Yuheng_theme") || "light";
        if (t === "system") t = window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("theme-mode", t);
        /* 与 theme.css 中 --td-bg-color-page 一致，避免样式加载后整页背景从 #fff 跳到 #eee 触发重绘闪动 */
        var bg = t === "dark" ? "#181818" : "#eee";
        document.documentElement.style.background = bg;
        document.documentElement.style.minHeight = "100%";
        document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
        document.body.style.background = bg;
        document.body.style.minHeight = "100%";
      })();
    </script>
    <script src="/config.js"></script>
    <!--
  离线部署兼容：提前本地加载 tdesign-icons SVG sprite，避免 tdesign-vue-next 的
  <t-icon> 运行时向 https://tdesign.gtimg.com 发起请求（见 issue #867 / #897）。
  升级 tdesign-icons-vue-next 时需同步更新 public/tdesign-icons/<version>/fonts/index.js。
-->
    <script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
    <div id="app"></div>
    <script>
      (function () {
        var t = localStorage.getItem("Yuheng_theme") || "light";
        if (t === "system") t = window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
        var bg = t === "dark" ? "#181818" : "#eee";
        var el = document.getElementById("app");
        if (el) {
          el.style.background = bg;
          el.style.minHeight = "100%";
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
