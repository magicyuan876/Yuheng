server {
    listen 80;
    server_name localhost;
    # Default 50M, configured via MAX_FILE_SIZE_MB env var
    client_max_body_size ${MAX_FILE_SIZE};

    # 启用 gzip 压缩静态资源 (前端 index.js 单文件 ~1MB, 不压实测 20s+,
    # 压缩后约 200-300KB, 大陆同地域低带宽机器加载从 25s 降到 3-5s)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 错误日志配置
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 及 SPA fallback 不可缓存，否则前端升级后用户看不到新版本
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header 不从上层继承，需要在 location 内重复声明安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite 构建产物 /assets/* 带 hash 文件名，可长期缓存
    location ^~ /assets/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 本地存储文件代理到后端服务（用于渲染 markdown 中的图片）
    # 精确匹配 /files，避免 Nginx 自动补 / 触发 301
    location = /files {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 资源能力短链 /r/<token>：会话内 resource:// 图片依赖此路由，
    # 缺此段会落进 SPA fallback 返回空白页，图片加载不出来。
    location ^~ /r/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 在线文档的协同编辑 WebSocket。走同源同端口是有意的：浏览器只需要认识
    # 一个地址，YUHENG_COLLAB_URL 填 ws://<本站>/collab 即可，不用再单独放通
    # 一个端口，也不会在 HTTPS 页面里混进 ws:// 的不安全连接。
    #
    # 协同服务不启动时这里返回 502，前端据此退回独占编辑模式。
    #
    # 注意 proxy_pass 后面没有路径：请求原样透传，所以协同服务收到的是
    # /collab/... 而不是 /...。它的内部回调接口匹配的是 /internal/collab/…，
    # 经这里进来一律不匹配、返回 404 —— 内部接口只能从容器网络里直连，
    # 不会因为开了这条 location 而暴露到公网。
    #
    # 上游地址放进变量、并配 resolver，nginx 才会在收到请求时才解析主机名。
    # 直接写 proxy_pass http://collab:1234 的话，nginx 启动时就要解析 collab；
    # 默认 profile 不启动它，解析失败会让整个前端容器起不来（"host not found in
    # upstream"），而不是只让这一个路径返回 502。变量形式不带 URI，请求路径仍原样透传。
    location ^~ /collab {
        resolver ${DNS_RESOLVER} valid=10s ipv6=off;
        set $collab_upstream http://${COLLAB_HOST}:${COLLAB_PORT};
        proxy_pass $collab_upstream;
        proxy_http_version 1.1;
        # 这两行是 WebSocket 握手的全部要求，少一行连接就升级不了。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一条协同连接会在一篇文档打开期间一直存在，按默认 60s 读超时会被
        # 反复掐断重连，看起来就像网络不稳定。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API请求代理到后端服务
    # APP_SCHEME 默认 http，远程 HTTPS 后端可设为 https
    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 连接和重试配置
        proxy_connect_timeout 30s;                 # 连接超时时间
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;               # 重试次数
        proxy_next_upstream_timeout 30s;           # 重试超时时间
        
        # SSE 相关配置
        proxy_http_version 1.1;                    # 使用 HTTP/1.1
        proxy_set_header Connection "";            # 禁用 Connection: close，保持连接打开
        chunked_transfer_encoding off;             # 关闭分块传输编码
        proxy_buffering off;                       # 关闭缓冲
        proxy_cache off;                           # 关闭缓存
        proxy_read_timeout 3600s;                  # 增加读取超时时间
        proxy_send_timeout 3600s;                  # 增加发送超时时间
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
