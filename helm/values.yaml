#
# Yuheng Helm Chart Values
#
# Best Practices References:
# - https://helm.sh/docs/chart_best_practices/values/
# - https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# - https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

# -- Global configuration shared across all components
# @default -- See values.yaml
global:
  # -- Storage class for all PersistentVolumeClaims
  # Set to "-" to use cluster default, or specify a storage class name
  storageClass: ""

  # -- Registry and path holding Yuheng's own images. **Required** (unless
  # every enabled component sets its own image.repository): Yuheng publishes
  # no images, so there is nothing to pull until you build them and push them
  # somewhere. The chart pulls <imageRegistry>/yuheng-app, /yuheng-ui,
  # /yuheng-docreader and /yuheng-collab, tagged Chart.appVersion unless a
  # component's image.tag says otherwise, and refuses to render without it.
  # See "Images" in README.md. Example: registry.example.com/yuheng
  imageRegistry: ""

  # -- Image pull secrets for private registries
  # @default -- []
  imagePullSecrets: []
  # - name: regcred

  # -- Default security context for all pods
  # Note: Official images (nginx, postgres, redis) run as root by default
  # Enable runAsNonRoot only if using non-root compatible images
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Default security context for all containers
  # Note: readOnlyRootFilesystem disabled as images require writable filesystem
  containerSecurityContext:
    allowPrivilegeEscalation: false

# -- ServiceAccount configuration
# Ref: https://helm.sh/docs/chart_best_practices/rbac/
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Labels to add to the ServiceAccount
  labels: {}
  # -- Automount API credentials for the ServiceAccount
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# App (Backend API Server)
# -----------------------------------------------------------------------------
app:
  # -- Enable the app component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository (default: <global.imageRegistry>/yuheng-app)
    repository: ""
    # -- Image tag (default: Chart.appVersion)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # -- Pod security context override
  podSecurityContext: {}

  # -- Container security context override
  # Note: App requires write access for file storage
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Environment variables for the app container
  # Ref: https://github.com/magicyuan876/yuheng/blob/main/docker-compose.yml
  env:
    GIN_MODE: release
    # -- Retrieval driver. The built-in engine is postgres (ParadeDB + pgvector).
    RETRIEVE_DRIVER: postgres
    # -- Retry an interrupted migration automatically. Off by default: it is only safe
    # when the failed migration can run twice. See docs/migration-troubleshooting.md.
    AUTO_RECOVER_DIRTY: "false"
    STREAM_MANAGER_TYPE: redis
    CONCURRENCY_POOL_SIZE: "5"
    TZ: UTC

  # -- Additional environment variables
  extraEnv: []
  # - name: OLLAMA_BASE_URL
  #   value: "http://ollama:11434"

  # -- Hosts the app may reach although they resolve to private addresses
  # (SSRF_WHITELIST_EXTRA: exact names, *.example.com wildcards, IPs or
  # CIDRs). The chart already adds the host of the deployment storage (see
  # `storage`), which the app cannot work without; list your own additions
  # here rather than in extraEnv, where a second SSRF_WHITELIST_EXTRA would
  # replace the chart's entry instead of adding to it.
  ssrfWhitelistExtra: []
  # - ollama.ollama.svc

  # -- Service configuration
  service:
    type: ClusterIP
    port: 8080

  # -- Seconds Kubernetes waits between SIGTERM and SIGKILL. Must exceed the server's
  # own drain window (server.shutdown_timeout, 30s by default) so in-flight chat
  # streams and ingestion tasks can finish.
  terminationGracePeriodSeconds: 45

  # -- Startup probe. The server applies database migrations before it listens, so a
  # slow migration would otherwise be killed by the liveness probe halfway through.
  # 5 minutes by default (30 x 10s); raise failureThreshold for very large databases.
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

  # -- Liveness probe configuration. /health only says the process is up; it does not
  # look at the database, so a database outage does not restart the pods.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration. /ready answers 200 only when the database (and
  # Redis, if configured) respond and the migration state is clean; otherwise 503
  # and the pod is taken out of the Service without being restarted.
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Frontend (Web UI)
# -----------------------------------------------------------------------------
frontend:
  # -- Enable the frontend component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository (default: <global.imageRegistry>/yuheng-ui)
    repository: ""
    # -- Image tag (default: Chart.appVersion)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    type: ClusterIP
    port: 80

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Docreader (Document Parser - gRPC)
# -----------------------------------------------------------------------------
docreader:
  # -- Enable the docreader component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository (default: <global.imageRegistry>/yuheng-docreader)
    repository: ""
    # -- Image tag (default: Chart.appVersion)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    type: ClusterIP
    port: 50051

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Online documents (docs module)
# -----------------------------------------------------------------------------
docs:
  # -- Enable the docs module. Off by default; registers /api/v1/docs/** and
  # the tenant group endpoints.
  enabled: false

  # -- Browser-facing WebSocket URL of the collaboration service. Leave empty
  # for exclusive editing (one writer per page at a time), which is a complete
  # and supported mode, not a degraded one. When collab.enabled is true this is
  # usually "wss://<ingress.host>/collab".
  collabUrl: ""

  # -- Largest Yjs state accepted for one page, in bytes. Shared with the
  # collaboration service so that both ends agree on the limit.
  maxYDocBytes: 20971520

  # -- Largest attachment, in bytes.
  maxAttachmentBytes: 209715200

  # -- Days a trashed page is kept before the sweep purges it.
  trashRetentionDays: 30

  # -- Allow pages to be shared with people outside the workspace.
  publicSharing: false

  # -- Additional YUHENG_DOCS_* variables, passed through to the app verbatim.
  extraEnv: []

# -----------------------------------------------------------------------------
# Docs collaboration service (Hocuspocus / Yjs)
# -----------------------------------------------------------------------------
collab:
  # -- Enable the collaboration service. Requires docs.enabled.
  # Leaving this off does not disable online documents: the editor falls back
  # to exclusive editing, using the same build and the same UI.
  enabled: false

  # -- Number of replicas. More than one requires collab.redis.enabled, or the
  # replicas will not see each other's edits.
  replicaCount: 1

  image:
    # -- Image repository (default: <global.imageRegistry>/yuheng-collab)
    repository: ""
    # -- Image tag (default: Chart.appVersion)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Log level: debug | info | warn | error
  logLevel: info

  redis:
    # -- Share documents between replicas through Redis. Required for
    # replicaCount > 1.
    enabled: false
    # -- Full Redis URL. Empty builds one from the chart's Redis and the
    # database below.
    url: ""
    # -- Redis database index, kept away from the app's own.
    database: 3

  # -- Seconds a terminating pod is given to flush unsaved documents. Longer
  # than the service's own flush timeout on purpose.
  terminationGracePeriodSeconds: 45

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # -- Container security context
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    type: ClusterIP
    port: 1234

  # -- Additional environment variables (COLLAB_*, see collab/README.md)
  extraEnv: []

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# PostgreSQL (ParadeDB - Vector + BM25 Search)
# -----------------------------------------------------------------------------
postgresql:
  # -- Enable PostgreSQL
  enabled: true

  image:
    # -- Image repository (ParadeDB for vector search)
    repository: paradedb/paradedb
    # -- Image tag. Keep it equal to docker-compose.yml and to the image the
    # Go tests run the schema against (internal/testutil/pgtest); a ParadeDB
    # upgrade on an existing volume needs `ALTER EXTENSION pg_search UPDATE`,
    # see "Upgrading" in README.md.
    tag: v0.22.2-pg17

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Container security context
  # Note: PostgreSQL requires specific user permissions
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Redis (Stream & Task Queue)
# -----------------------------------------------------------------------------
# Served by Valkey, the BSD-licensed continuation of Redis; it speaks the Redis
# protocol, so the component keeps the name of its role. Keep the tag in step
# with docker-compose.yml.
redis:
  # -- Enable Redis
  enabled: true

  image:
    # -- Image repository
    repository: valkey/valkey
    # -- Image tag
    tag: 8.1.10-alpine

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 1Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# File Storage
# -----------------------------------------------------------------------------
# Where uploaded documents, extracted images and exports are kept: the
# deployment storage, which the app records as the storage backend "env" and
# every workspace uses by default (website-docs/03-features/19-storage-backends.md).
# The app rewrites that record from these settings on every start, and refuses
# to start when they name a different location than one that already holds
# files: changing storage.type, the bucket or a path prefix on a release with
# data is a data migration, not an upgrade.
storage:
  # -- Where files are stored:
  # `rustfs` - a RustFS server run by this chart (S3-compatible; the default,
  #   as in docker-compose);
  # `s3` - an S3-compatible service you run or buy (AWS S3, MinIO, Aliyun OSS,
  #   Tencent COS, Volcengine TOS, Huawei OBS, ...), configured under storage.s3;
  # `local` - a volume mounted into the app. One app replica only: the chart
  #   refuses to render with app.replicaCount > 1.
  type: rustfs

  # -- Storage providers workspaces may use, the deployment storage included
  # (STORAGE_ALLOW_LIST). Empty lets the chart choose what this deployment can
  # actually hold: `s3` always, and `local` only when storage.type is local,
  # since that is the only case with a volume behind the local directory. A
  # workspace's local backend on any other type would write into the pod's
  # own filesystem and lose its files with the pod.
  # @default -- [] (chart decides)
  allowList: []
  # - s3

  # -- Settings for the S3 API. storage.type=s3 reads all of them; with
  # storage.type=rustfs only bucket and pathPrefix apply, because the chart
  # runs that server and fixes its endpoint, region, SSL and addressing.
  # Credentials are secrets.storageAccessKey / secrets.storageSecretKey.
  s3:
    # -- Endpoint URL, with or without a scheme (S3_ENDPOINT). Empty means AWS
    # S3, whose endpoint the SDK derives from the region. A host that resolves
    # to a private address (an in-cluster MinIO, a VPC endpoint) is added to
    # the app's SSRF allow list automatically.
    endpoint: ""
    # -- Region (S3_REGION). Required for storage.type=s3.
    region: us-east-1
    # -- Bucket (S3_BUCKET_NAME). The app creates it on first use when the
    # credentials allow that.
    bucket: yuheng
    # -- Key prefix inside the bucket (S3_PATH_PREFIX)
    pathPrefix: yuheng/
    # -- Use https when the endpoint has no scheme (S3_USE_SSL)
    useSSL: true
    # -- auto | path | virtual (S3_ADDRESSING_STYLE). auto picks
    # virtual-hosted URLs for AWS and path-style for every other endpoint;
    # Aliyun OSS, Tencent COS, Volcengine TOS and Huawei OBS need virtual.
    addressingStyle: auto

  local:
    # -- Subdirectory of the volume that holds the deployment storage
    # (LOCAL_STORAGE_PATH_PREFIX); empty is the volume root.
    pathPrefix: ""
    persistence:
      # -- Keep files on a PersistentVolumeClaim. Without it they live in an
      # emptyDir and are lost whenever the app pod is replaced.
      enabled: true
      # -- Size of the PVC
      size: 10Gi
      # -- Storage class of the PVC (default: global.storageClass; "-" for
      # the cluster default)
      storageClass: ""
      # -- Use existing PVC (leave empty to create new)
      existingClaim: ""

  # -- The bundled RustFS server (storage.type=rustfs). A single node with a
  # single volume, which is what docker-compose runs: it has no redundancy of
  # its own, so it is as durable as the volume under it. For replicated object
  # storage run a dedicated cluster and use storage.type=s3.
  rustfs:
    image:
      # -- Image repository. A third-party image, so global.imageRegistry
      # does not apply.
      repository: rustfs/rustfs
      # -- Image tag. Informational once a digest is set.
      tag: latest
      # -- Image digest, the one docker-compose.yml pins. RustFS is still
      # pre-1.0 (1.0.0-rc.5 here) and a floating tag could change the on-disk
      # format underneath the data; keep the two files in step.
      digest: sha256:b7014e0ce2bc703c1316b3ef760e29dfae61fe4a50d1a66fa89638e0f8ea211f

    # -- Resource requests and limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    # -- Pod security context, merged over global.podSecurityContext. The
    # image runs as the unprivileged user rustfs (10001); fsGroup makes a
    # freshly provisioned volume writable for it, and OnRootMismatch keeps a
    # restart from walking every object to re-chown it.
    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch

    # -- Container security context. RustFS writes only to its data volume
    # once its logs go to stdout, so the root filesystem can be read-only.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    persistence:
      # -- Enable persistence. Without it every object is lost with the pod.
      enabled: true
      # -- Size of the PVC: every uploaded document and extracted image.
      size: 20Gi
      # -- Storage class of the PVC (default: global.storageClass; "-" for
      # the cluster default)
      storageClass: ""
      # -- Use existing PVC (leave empty to create new)
      existingClaim: ""

    # -- Service configuration. The Service is named "rustfs", which is the
    # endpoint the app is given.
    service:
      type: ClusterIP
      # -- S3 API port
      port: 9000
      # -- Web console port (reach it with kubectl port-forward)
      consolePort: 9001

    # -- Node selector
    nodeSelector: {}

    # -- Tolerations
    tolerations: []

    # -- Affinity rules
    affinity: {}

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  # -- Enable ingress
  enabled: false

  # -- Ingress class name
  className: nginx

  # -- Ingress hostname
  host: yuheng.example.com

  # -- TLS configuration
  tls:
    # -- Enable TLS
    enabled: false
    # -- TLS secret name
    secretName: ""

  # -- Additional annotations
  # Ref: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# IMPORTANT: Do NOT use default values in production!
# Use --set or external secret management (External Secrets Operator, Vault, etc.)
#
# Example installation:
#   helm install yuheng ./helm \
#     --set secrets.dbPassword=<secure-password> \
#     --set secrets.redisPassword=<secure-password> \
#     --set secrets.jwtSecret=<secure-random-string>
#
secrets:
  # -- Database username
  dbUser: postgres
  # -- Database password (REQUIRED: change in production)
  dbPassword: ""
  # -- Database name
  dbName: yuheng
  # -- Redis username (OPTIONAL: for Redis 6.0+ ACL)
  redisUsername: ""
  # -- Redis password (REQUIRED: change in production)
  redisPassword: ""
  # -- JWT signing secret (REQUIRED: change in production)
  jwtSecret: ""
  # -- HMAC secret shared between the app and the collaboration service
  # (REQUIRED when collab.enabled is true; at least 16 characters).
  # Generate with: openssl rand -base64 32
  collabSharedSecret: ""
  # -- System AES-256 key for database field encryption (must be exactly 32 bytes).
  # Encrypts: tenants.api_key, model API keys, vector store credentials,
  # web search provider keys, model AppSecret values.
  # STRONGLY RECOMMENDED to set this explicitly in production. If left empty, a
  # random 32-char value is generated on first install and reused on subsequent
  # `helm upgrade` via Secret lookup. However, if the Secret is ever
  # deleted/recreated (e.g. namespace recreated, GitOps prune, cluster rebuilt)
  # a new random value will be generated and any data encrypted with the old
  # key becomes UNRECOVERABLE (the UI will display ciphertext like "enc:v1:..."
  # instead of plaintext).
  # NOTE: TENANT_AES_KEY is deprecated — encryption now uses
  # SYSTEM_AES_KEY exclusively. The Go app no longer reads TENANT_AES_KEY and
  # it has been removed from the Secret.
  systemAesKey: ""
  # -- Access key of the deployment storage (S3_ACCESS_KEY). With
  # storage.type=rustfs it is also the RustFS root user, and REQUIRED. With
  # storage.type=s3 it is optional together with storageSecretKey: both empty
  # selects the AWS default credential chain (IRSA, instance roles). Unused for
  # storage.type=local.
  storageAccessKey: ""
  # -- Secret key of the deployment storage (S3_SECRET_KEY); with
  # storage.type=rustfs the RustFS root password, and REQUIRED.
  # Generate with: openssl rand -base64 24
  storageSecretKey: ""

  # -- Use existing secret instead of creating one
  # The secret must contain keys: DB_USER, DB_PASSWORD, DB_NAME, REDIS_USERNAME, REDIS_PASSWORD, JWT_SECRET, SYSTEM_AES_KEY,
  # and S3_ACCESS_KEY / S3_SECRET_KEY for storage.type=rustfs (optional for s3: absent means the AWS default credential
  # chain), plus COLLAB_SHARED_SECRET and NEO4J_USERNAME / NEO4J_PASSWORD when those components are enabled.
  existingSecret: ""

# -----------------------------------------------------------------------------
# Optional Components (Profiles from docker-compose)
# -----------------------------------------------------------------------------

# -- Neo4j configuration (Knowledge Graph)
# Equivalent to: docker compose --profile neo4j
# Required for GraphRAG feature (sets NEO4J_ENABLE=true automatically when enabled)
neo4j:
  # -- Enable Neo4j for GraphRAG
  enabled: false

  image:
    # -- Image repository
    repository: neo4j
    # -- Image tag (matches docker-compose.yml)
    tag: "2025.10.1"

  # -- Neo4j authentication username
  username: neo4j
  # -- Neo4j authentication password (REQUIRED if enabled)
  password: ""

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}
