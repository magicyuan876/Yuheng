{{- if .Values.docreader.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yuheng.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.docreader.replicaCount }}
  selector:
    matchLabels:
      {{- include "yuheng.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "yuheng.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 8 }}
    spec:
      {{- include "yuheng.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "yuheng.serviceAccountName" . }}
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docreader
          image: {{ include "yuheng.docreader.image" . }}
          imagePullPolicy: {{ .Values.docreader.image.pullPolicy }}
          {{- with .Values.docreader.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          {{- if include "yuheng.storage.sharedWithDocreader" . }}
          # Local storage: the app's volume, read-only. The app passes large
          # videos as a path under it instead of sending their bytes over
          # gRPC; the directory is also the path-traversal boundary for
          # those paths. Every other storage type sends bytes, and docreader
          # needs no volume and no storage settings at all.
          env:
            - name: DOCREADER_SHARED_DATA_DIR
              value: "/data/files"
          volumeMounts:
            - name: data-files
              mountPath: /data/files
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.docreader.resources | nindent 12 }}
          # gRPC health check using grpc_health_probe
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      {{- if include "yuheng.storage.sharedWithDocreader" . }}
      volumes:
        {{- include "yuheng.storage.localVolume" . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.docreader.affinity }}
      affinity:
        {{- toYaml .Values.docreader.affinity | nindent 8 }}
      {{- else if include "yuheng.storage.sharedWithDocreader" . }}
      # A ReadWriteOnce volume is attachable to one node at a time, so
      # docreader has to run where the app runs. docreader.affinity, when set,
      # replaces this rule and then has to keep the two together itself.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "yuheng.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.docreader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "docreader" - app references this
  name: docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.docreader.service.type }}
  selector:
    {{- include "yuheng.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.docreader.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
