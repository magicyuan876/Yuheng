{{- include "yuheng.storage.validate" . }}
{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yuheng.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "yuheng.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 6 }}
  strategy:
    {{- if eq .Values.storage.type "local" }}
    # Local storage is a ReadWriteOnce volume: a surge pod scheduled onto
    # another node could never attach it and would hold the rollout forever,
    # so the old pod goes first and the new one takes over its volume.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "yuheng.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 8 }}
    spec:
      {{- include "yuheng.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "yuheng.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds | default 45 }}
      {{- with .Values.app.podSecurityContext | default .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "yuheng.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Application settings
            - name: GIN_MODE
              value: {{ .Values.app.env.GIN_MODE | quote }}
            - name: TZ
              value: {{ .Values.app.env.TZ | quote }}
            # Database configuration
            - name: DB_DRIVER
              value: "postgres"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: DB_NAME
            # Redis configuration
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: REDIS_USERNAME
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "0"
            - name: REDIS_PREFIX
              value: "stream:"
            - name: STREAM_MANAGER_TYPE
              value: {{ .Values.app.env.STREAM_MANAGER_TYPE | quote }}
            # Security
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: JWT_SECRET
            - name: SYSTEM_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: SYSTEM_AES_KEY
            # Retrieval
            - name: RETRIEVE_DRIVER
              value: {{ .Values.app.env.RETRIEVE_DRIVER | quote }}
            # File storage (storage.* in values.yaml)
            {{- include "yuheng.storage.env" . | nindent 12 }}
            {{- with include "yuheng.app.ssrfWhitelistExtra" . }}
            - name: SSRF_WHITELIST_EXTRA
              value: {{ . | quote }}
            {{- end }}
            # Document reader
            - name: DOCREADER_ADDR
              value: "docreader:50051"
            # Processing
            - name: AUTO_RECOVER_DIRTY
              value: {{ .Values.app.env.AUTO_RECOVER_DIRTY | quote }}
            - name: CONCURRENCY_POOL_SIZE
              value: {{ .Values.app.env.CONCURRENCY_POOL_SIZE | quote }}
            {{- if .Values.neo4j.enabled }}
            # Neo4j configuration (for GraphRAG)
            # NEO4J_ENABLE 是知识图谱的唯一开关（Go 代码认它，不认 ENABLE_GRAPH_RAG）。
            # neo4j.enabled=true 时自动注入，无需用户单独设置。
            - name: NEO4J_ENABLE
              value: "true"
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: NEO4J_PASSWORD
            {{- end }}
            {{- if .Values.docs.enabled }}
            # Online documents. The module is off unless this is true, and the
            # collaboration variables below are what decide whether the editor
            # is collaborative or exclusive -- both are complete modes.
            - name: YUHENG_DOCS_ENABLED
              value: "true"
            - name: YUHENG_DOCS_MAX_YDOC_BYTES
              value: {{ .Values.docs.maxYDocBytes | quote }}
            - name: YUHENG_DOCS_MAX_ATTACHMENT_BYTES
              value: {{ .Values.docs.maxAttachmentBytes | quote }}
            - name: YUHENG_DOCS_TRASH_RETENTION_DAYS
              value: {{ .Values.docs.trashRetentionDays | quote }}
            - name: YUHENG_DOCS_PUBLIC_SHARING
              value: {{ .Values.docs.publicSharing | quote }}
            {{- if .Values.collab.enabled }}
            # What the browser is told to connect to. Defaults to the ingress
            # host, which is where the /collab rule sends WebSocket traffic.
            - name: YUHENG_COLLAB_URL
              value: {{ .Values.docs.collabUrl | default (printf "%s://%s/collab" (ternary "wss" "ws" .Values.ingress.tls.enabled) .Values.ingress.host) | quote }}
            # What this server calls back on: the Service directly, not through
            # the ingress. An internal call has no business leaving the cluster.
            - name: YUHENG_COLLAB_INTERNAL_URL
              value: "http://collab:1234"
            - name: YUHENG_COLLAB_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: COLLAB_SHARED_SECRET
            {{- else if .Values.docs.collabUrl }}
            - name: YUHENG_COLLAB_URL
              value: {{ .Values.docs.collabUrl | quote }}
            {{- end }}
            {{- with .Values.docs.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.app.extraEnv }}
            # Additional environment variables
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq .Values.storage.type "local" }}
          volumeMounts:
            - name: data-files
              mountPath: /data/files
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- with .Values.app.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if eq .Values.storage.type "local" }}
      volumes:
        {{- include "yuheng.storage.localVolume" . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "app" - frontend nginx config hardcodes this
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "yuheng.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
