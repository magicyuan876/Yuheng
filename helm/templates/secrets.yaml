Modifications Copyright (c) 2026 magicyuan876.
SPDX-License-Identifier: MIT

Secrets for Yuheng components.

IMPORTANT: For production deployments, use one of these approaches:
1. Set values via --set flags during installation
2. Use External Secrets Operator with cloud secret managers
3. Use sealed-secrets for GitOps workflows
4. Provide an existing secret via secrets.existingSecret
*/}}
{{- if not .Values.secrets.existingSecret }}
{{/*
Reuse the previously generated random keys on upgrade. Without this lookup,
randAlphaNum would re-roll on every `helm upgrade` and rotate SYSTEM_AES_KEY,
making any data encrypted with the old key unreadable
(e.g. tenants.api_key would surface as enc:v1:... in the UI).
*/}}
{{- $secretName := include "yuheng.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingSystemKey := "" }}
{{- if and $existing $existing.data }}
  {{- if index $existing.data "SYSTEM_AES_KEY" }}
    {{- $existingSystemKey = index $existing.data "SYSTEM_AES_KEY" | b64dec }}
  {{- end }}
{{- end }}
{{- $systemAesKey := .Values.secrets.systemAesKey | default $existingSystemKey | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  # Redis credentials
  REDIS_USERNAME: {{ .Values.secrets.redisUsername | default "" | quote }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | quote }}
  # Application secrets
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  # SYSTEM_AES_KEY 加密：tenants.api_key、模型 API key、向量库凭证、web search provider key、
  # 模型 AppSecret 等。（TENANT_AES_KEY 已废弃：加密统一用 SYSTEM_AES_KEY，
  # Go 主应用不再读取 TENANT_AES_KEY，已从 Secret 中移除。）
  SYSTEM_AES_KEY: {{ $systemAesKey | quote }}
  {{- if eq .Values.storage.type "rustfs" }}
  # Root credentials of the bundled RustFS, which the app also uses to reach
  # it: one pair, so the two can never disagree. Required rather than
  # generated, like the database password: whoever holds them controls every
  # stored document, and the console is where an operator would use them.
  S3_ACCESS_KEY: {{ required "secrets.storageAccessKey is required when storage.type is rustfs (the RustFS root user)" .Values.secrets.storageAccessKey | quote }}
  S3_SECRET_KEY: {{ required "secrets.storageSecretKey is required when storage.type is rustfs (the RustFS root password)" .Values.secrets.storageSecretKey | quote }}
  {{- else if and (eq .Values.storage.type "s3") .Values.secrets.storageAccessKey }}
  # Static keys of the external object storage. Left out entirely when none
  # are given, so that the app falls back to the AWS default credential chain.
  S3_ACCESS_KEY: {{ .Values.secrets.storageAccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.storageSecretKey | quote }}
  {{- end }}
  {{- if .Values.collab.enabled }}
  # Signs every callback in both directions between the app and the
  # collaboration service. Required rather than generated: both sides read it,
  # and a value this chart rolled would have to be handed to anything outside
  # the release that also talks to the service.
  COLLAB_SHARED_SECRET: {{ required "secrets.collabSharedSecret is required when collab.enabled is true" .Values.secrets.collabSharedSecret | quote }}
  {{- end }}
  {{- if .Values.neo4j.enabled }}
  # Neo4j credentials (for GraphRAG)
  NEO4J_USERNAME: {{ .Values.neo4j.username | quote }}
  NEO4J_PASSWORD: {{ required "neo4j.password is required when neo4j is enabled" .Values.neo4j.password | quote }}
  {{- end }}
{{- end }}
