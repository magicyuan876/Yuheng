{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yuheng.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "cache" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "yuheng.componentSelectorLabels" (dict "component" "cache" "context" .) | nindent 6 }}
  # Use Recreate strategy to avoid data corruption
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "yuheng.componentSelectorLabels" (dict "component" "cache" "context" .) | nindent 8 }}
    spec:
      {{- include "yuheng.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "yuheng.serviceAccountName" . }}
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "yuheng.redis.image" . }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - valkey-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "yes"
            - --dir
            - /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: REDIS_PASSWORD
            # valkey-cli reads the password from here, so the probes do not
            # put it on a command line.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "yuheng.secretName" . }}
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.redis.persistence.existingClaim | default (printf "%s-redis" (include "yuheng.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "redis" - app references this
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "cache" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yuheng.componentSelectorLabels" (dict "component" "cache" "context" .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
