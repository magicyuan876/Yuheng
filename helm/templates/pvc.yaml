{{/* Local file storage PVC (storage.type=local) */}}
{{- if and (eq .Values.storage.type "local") .Values.storage.local.persistence.enabled (not .Values.storage.local.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yuheng.fullname" . }}-data-files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "storage" "context" .) | nindent 4 }}
  annotations:
    {{- include "yuheng.storage.keepAnnotation" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.local.persistence.size }}
  {{- include "yuheng.persistenceStorageClass" (dict "root" . "storageClass" .Values.storage.local.persistence.storageClass) | nindent 2 }}
---
{{- end }}

{{/* RustFS PVC (storage.type=rustfs) */}}
{{- if and (eq .Values.storage.type "rustfs") .Values.storage.rustfs.persistence.enabled (not .Values.storage.rustfs.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yuheng.fullname" . }}-rustfs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "object-storage" "context" .) | nindent 4 }}
  annotations:
    {{- include "yuheng.storage.keepAnnotation" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.rustfs.persistence.size }}
  {{- include "yuheng.persistenceStorageClass" (dict "root" . "storageClass" .Values.storage.rustfs.persistence.storageClass) | nindent 2 }}
{{- end }}
