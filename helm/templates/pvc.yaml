{{/* PostgreSQL PVC */}}
{{- if and .Values.postgresql.enabled .Values.postgresql.persistence.enabled (not .Values.postgresql.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yuheng.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "database" "context" .) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
  {{- include "yuheng.storageClass" . | nindent 2 }}
---
{{- end }}

{{/* Redis PVC */}}
{{- if and .Values.redis.enabled .Values.redis.persistence.enabled (not .Values.redis.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yuheng.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yuheng.componentLabels" (dict "component" "cache" "context" .) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
  {{- include "yuheng.storageClass" . | nindent 2 }}
