{{/* Neo4j PVC */}}
{{- if and .Values.neo4j.enabled .Values.neo4j.persistence.enabled (not .Values.neo4j.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yuheng.fullname" . }}-neo4j
  namespace: {{ .Release.Namespace }}
