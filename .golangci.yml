version: "2"
linters:
  enable:
    - lll           # 控制行宽
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
    errcheck:
      # Terminal output. The CLI and the server's own console messages write
      # with fmt.Fprint* to stdout/stderr; a failed write there has no
      # recovery and is never worth a branch. Everything else stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # gin's c.Error records the error for the error middleware to render
        # and returns the same error wrapped; every handler ignores the
        # return, which carries nothing to act on.
        - (*github.com/gin-gonic/gin.Context).Error
  exclusions:
    paths:
      # Swagger output written by `make docs`. swag's header does not match the
      # standard "Code generated … DO NOT EDIT." form golangci-lint recognises,
      # so without this every regeneration reports its long lines as new.
      - ^docs/docs\.go$
formatters:
  enable:
    - gofmt
    - gofumpt
