        将向量库设为平台共享（所有空间可见可选用，连接配置对非系统管理员隐藏）或取消共享。
        仅系统管理员可调用。取消共享时，若owner 之外的空间仍有知识库绑定该向量库，请求会被拒绝。
      parameters:
      - description: 向量库 ID
        in: path
        name: id
        required: true
        type: string
