      - VectorStore
  /vector-stores/{id}:
    delete:
      description: Soft-delete a vector store. Env stores cannot be deleted.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store cannot be deleted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete vector store
      tags:
      - VectorStore
    get:
      description: Retrieve a single vector store by ID. Supports both DB stores and
        env stores (__env_* IDs)
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Vector store details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get vector store
      tags:
      - VectorStore
    put:
      consumes:
      - application/json
      description: Update a vector store (name only). Engine type, connection config,
        and index config are immutable. Env stores cannot be modified.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store or validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update vector store
      tags:
      - VectorStore
