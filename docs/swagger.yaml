  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        注册新用户账号。注册只创建账号，不创建空间；用户通过邀请或由系统管理员加入空间。
        例外是部署的首个账号（/auth/config 的 first_user 为 true）：它同时创建部署的默认空间并成为其 Owner，
        可通过 workspace_name 指定空间名称（为空则为 "Default Workspace"）。
      parameters:
      - description: 注册请求参数
        in: body
        name: request
        required: true
