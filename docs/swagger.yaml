            additionalProperties: true
            type: object
        "400":
          description: Invalid request, weak password, or self reset
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Reset another user's password
      tags:
      - System Admin
