      consumes:
      - application/json
      description: |-
        保存平台默认解析引擎参数，对所有空间生效（空间可再自行覆盖，除非已开启集中管控）。
        凭据字段传回掩码占位符表示"不修改"。仅系统管理员可访问。
      parameters:
      - description: 解析引擎配置
        in: body
