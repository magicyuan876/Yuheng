        description: Image processing configuration
      indexing_strategy:
        allOf:
        - $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.IndexingStrategy'
        description: |-
          IndexingStrategy controls which indexing pipelines are active.
