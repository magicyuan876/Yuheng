      - Bearer: []
      summary: 修改空间成员角色
      tags:
      - 空间成员
  /system/admin/tenants/apply-default-storage-quota:
    post:
      description: |-
        Reads the current value of `tenant.default_storage_quota_gb`
        (3-tier resolver: DB > ENV > default) and writes that many
        GiB into storage_quota for every row in tenants; 0 removes
        the limit everywhere. Bypasses the per-workspace PUT
        whitelist, which forbids storage_quota edits by Owners.
        SystemAdmin only. Idempotent — running twice with the same
        setting is a no-op.
      produces:
      - application/json
      responses:
        "200":
          description: '{ affected: int64, quota_bytes: int64 }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Apply the default storage quota to every existing workspace
      tags:
      - System Admin
  /system/admin/users/create:
    post:
      consumes:
      - application/json
      description: |-
        Provision a new local user account (SystemAdmin only).
        When `password` is omitted or null, a cryptographically random
        password is generated (OIDC-style crypto/rand + base64url)
        and returned once in the response body. Any provided value,
        including empty string, is policy-checked. With `tenant_id`
        (and optional `role`, default viewer) the account is also made
        a member of that workspace in the same request; without it the
        account belongs to no workspace until it is added to one.
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.AdminCreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Identity already exists, returns the existing user
          schema:
            $ref: '#/definitions/internal_handler.CreateSystemUserResponse'
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/internal_handler.CreateSystemUserResponse'
        "400":
          description: Invalid request, weak password, or invalid role
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: tenant_id names no workspace
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email and username refer to conflicting identities
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user (SystemAdmin)
      tags:
      - System Admin
  /system/admin/users/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Replace another user's local password and revoke all of their existing sessions (SystemAdmin only).
        A system administrator cannot reset their own password through this endpoint; self-service password change still requires the old password.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ResetUserPasswordRequest'
      produces:
