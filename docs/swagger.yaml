      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: New value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateSystemSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the updated row
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.SystemSetting'
        "400":
          description: Bad request / unknown key / type mismatch
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: Update a system setting value
      tags:
      - System Admin
