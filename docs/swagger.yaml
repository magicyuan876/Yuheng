      - System Admin
  /system/admin/parser-engine-config:
    get:
      description: |-
        返回系统管理员配置的平台默认解析引擎参数。优先级：部署 ENV < 平台默认 < 空间覆盖。
        凭据字段以掩码返回。仅系统管理员可访问。
