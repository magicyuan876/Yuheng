info:
  contact:
    name: Yuheng Github
    url: https://github.com/magicyuan876/yuheng
  description: Yuheng 知识库管理系统 API 文档
  termsOfService: http://swagger.io/terms/
  title: Yuheng API
  version: "1.0"
paths:
  /api/v1/knowledge/{id}/spans:
    get:
      consumes:
      - application/json
      description: 返回该知识在解析流水线的 trace tree（root → stage → subspan）：每段状态、耗时、input/output、错误码、langfuse_trace_id。支持
        ?attempt=N 查看历史尝试；不传则返回最新尝试。前端用于渲染时间线 + 多模态/embedding 子节点 + 一键跳转 Langfuse。
      parameters:
      - description: 知识ID
        in: path
        name: id
        required: true
        type: string
      - description: 指定尝试号；省略=最新
        in: query
        name: attempt
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取知识文档解析的 Span 树（含历史尝试）
      tags:
      - 知识管理
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前用户的登录密码。新密码须满足 8–32 位且同时包含字母与数字；成功后所有会话被撤销，需重新登录。
      parameters:
      - description: 密码修改请求
        in: body
        name: request
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      security:
      - Bearer: []
      summary: 修改密码
      tags:
      - 认证
  /auth/config:
    get:
      consumes:
      - application/json
      description: 返回当前部署的注册模式等公开认证配置，供前端决定是否展示注册入口
      produces:
      - application/json
      responses:
        "200":
          description: 认证配置
          schema:
            additionalProperties: true
            type: object
      summary: 获取认证配置
      tags:
      - 认证
  /auth/invitations/lookup:
    post:
      consumes:
      - application/json
      description: |-
        根据邀请链接中的 token 返回邀请上下文（空间名 / 角色 / 过期时间），
        供注册页展示。无认证；token 无效或被撤销返回 410。
        使用 POST + body 而非 GET + path，避免 token 落入访问日志 / 浏览器历史 / tracing。
      parameters:
      - description: 邀请 token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.invitationLookupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.invitationLookupResponse'
        "410":
          description: 链接无效或已撤销
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      summary: 解析共享邀请链接 token
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录并获取访问令牌
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.LoginResponse'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销当前访问令牌并登出
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      security:
      - Bearer: []
      summary: 用户登出
      tags:
      - 认证
  /auth/me:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      security:
      - Bearer: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /auth/me/preferences:
    put:
      consumes:
      - application/json
      description: |-
        按 PATCH 语义合并用户偏好（仅覆盖请求体里出现的字段，其余字段保持不变），
        数据存放在 users.preferences (JSON)，跨设备/浏览器自动同步。
      parameters:
      - description: Preferences patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateMyPreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的偏好
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      security:
      - Bearer: []
      summary: 更新当前用户的个性化设置
      tags:
      - 认证
  /auth/oidc/callback:
    get:
      consumes:
      - application/json
      description: 接收OIDC provider回调并由后端完成code交换，随后重定向回前端登录页
      parameters:
      - description: OIDC授权码
        in: query
        name: code
        type: string
      - description: OIDC状态
        in: query
        name: state
        type: string
      - description: OIDC错误码
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
      summary: OIDC登录重定向回调
      tags:
      - 认证
  /auth/oidc/config:
    get:
      consumes:
      - application/json
      description: 返回OIDC是否启用以及provider展示名称，供前端决定是否展示OIDC登录入口
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.OIDCConfigResponse'
      summary: 获取OIDC登录配置
      tags:
      - 认证
  /auth/oidc/start:
    get:
      description: |-
        与 /auth/oidc/url 不同，此端点直接 302 重定向到 OIDC Provider 的授权页，
        无需前端 JS 介入。适用于外部平台（如企业门户）直接给出一个链接即可
        触发 OIDC 授权码流程，借助 IdP 的 SSO session 实现免再次输密码。
      responses:
        "302":
          description: Found
      summary: 发起 OIDC 登录（直接 302）
      tags:
      - 认证
  /auth/oidc/url:
    get:
      consumes:
      - application/json
      description: 根据后端OIDC配置生成第三方登录跳转地址
      parameters:
      - description: OIDC回调地址
        in: query
        name: redirect_uri
        required: true
