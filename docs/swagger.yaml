      - application/json
      responses:
        "200":
          description: 更新后的向量库
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 仍被其他空间引用
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
        "403":
          description: 非系统管理员
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      security:
      - Bearer: []
      summary: 设置向量库平台共享
      tags:
      - VectorStore
