        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
        "409":
          description: 邮箱已注册
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
        "410":
          description: 链接无效或已撤销
          schema:
            $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_errors.AppError'
      summary: 使用共享链接注册
      tags:
      - 认证
