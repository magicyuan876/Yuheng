  github_com_magicyuan876_yuheng_internal_types.AutoTagConfig:
    properties:
      enabled:
        type: boolean
      max_tags:
        type: integer
      model_id:
        type: string
      skip_if_tagged:
        description: |-
          SkipIfTagged leaves documents that already carry tags untouched, so a
          deliberate manual classification is not diluted by model guesses. It is
          a pointer because the default is true: rows written before this field
          existed decode to nil and must not silently flip to "always append".
        type: boolean
    type: object
  github_com_magicyuan876_yuheng_internal_types.ChatHistoryConfig:
    properties:
      embedding_model_id:
        description: |-
          EmbeddingModelID is the ID of the embedding model used for vectorizing chat messages.
          Once messages have been indexed, the model cannot be changed (requires re-indexing).
        type: string
      enabled:
        description: Enabled controls whether chat history indexing is active
        type: boolean
      knowledge_base_id:
        description: |-
          KnowledgeBaseID is the auto-managed hidden knowledge base for chat history.
          This is set internally when the feature is first enabled; users should not set this directly.
        type: string
    type: object
  github_com_magicyuan876_yuheng_internal_types.ChunkingConfig:
    properties:
      child_chunk_size:
        description: |-
          ChildChunkSize is the size of child chunks used for embedding (default: 384).
          Only used when EnableParentChild is true.
        type: integer
      chunk_overlap:
        description: |-
          ChunkOverlap is how many characters consecutive chunks share. nil means
          not chosen, and takes the chunker's default (chunker.ChunkOverlapOrDefault);
          0 means no overlap, which atomic content such as a wiki-only base wants.
          A pointer because the two used to be one: an int field could not tell
          an omitted overlap from a deliberate 0, so 0 was read as "default" and
          could never be set.
        type: integer
      chunk_size:
        description: Chunk size
        type: integer
      enable_parent_child:
        description: |-
          EnableParentChild enables two-level parent-child chunking strategy.
          When enabled, large parent chunks provide context while small child chunks
          are used for vector matching. Retrieval matches on child but returns parent content.
        type: boolean
      languages:
        description: |-
          Languages hints the heuristic patterns. Empty = auto-detect from content.
          Examples: ["de"], ["en", "zh"].
        items:
          type: string
        type: array
      parent_chunk_size:
        description: |-
          ParentChunkSize is the size of parent chunks (default: 4096).
          Only used when EnableParentChild is true.
        type: integer
      parser_engine_rules:
        description: |-
          ParserEngineRules configures which parser engine to use for each file type.
          When empty, the builtin engine is used for all types.
        items:
          $ref: '#/definitions/github_com_magicyuan876_yuheng_internal_types.ParserEngineRule'
        type: array
      separators:
        description: Separators
        items:
          type: string
        type: array
      strategy:
        description: |-
          Strategy selects the adaptive chunking tier. Empty / "legacy" is the
          plain recursive splitter; "auto" lets a profiler pick between
          heading-aware, heuristic and recursive tiers; "heading" / "heuristic" /
          "recursive" pin the tier explicitly.
        type: string
      table_metadata_instructions:
        description: |-
          TableMetadataInstructions contains optional business guidance used when
          generating searchable summaries for CSV/Excel tables. The system-owned
          output contract remains fixed; these instructions only add domain context.
        type: string
      token_limit:
        description: |-
          TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize
          as a character count.
        type: integer
    type: object
  github_com_magicyuan876_yuheng_internal_types.ConnectionConfig:
    properties:
      addr:
        type: string
      api_key:
        description: AES-GCM encrypted
        type: string
      insecure_skip_verify:
        description: |-
          InsecureSkipVerify disables TLS certificate verification when talking
          to the backing store over HTTPS. Defaults to false (secure). Set it
          only for self-signed development clusters; production deployments
          should provide trusted certificates through the system CA pool.
        type: boolean
      password:
        description: AES-GCM encrypted
        type: string
      use_default_connection:
        description: |-
          UseDefaultConnection binds the store to the application's own
          PostgreSQL connection instead of a separate address.
        type: boolean
      username:
        type: string
      version:
        description: |-
          Version is the detected server version (e.g., "7.10.1", "16.2").
          Auto-populated by TestConnection on successful connectivity check.
        type: string
