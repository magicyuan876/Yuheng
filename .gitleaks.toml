# Secret-scan configuration (gitleaks). The default ruleset applies; the entries
# below are reviewed false positives, each naming why it is not a secret.
title = "Yuheng gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Fixed keys and tokens that exist only inside tests (Go and frontend)"
paths = [
  '''(^|/)[^/]*_test\.go$''',
  '''(^|/)frontend/src/.*\.test\.(ts|mjs|js)$''',
]

[[allowlists]]
description = "keyAlphabet is the character set of share-link tokens, not a credential"
paths = ['''internal/docs/share/share\.go''']
regexes = ['''keyAlphabet\s*=''']

[[allowlists]]
# docs/api/ no longer exists, but the scan walks the whole history, where
# its pages still carry the same placeholder keys.
description = "API documentation examples; the sample keys in them are obvious placeholders"
paths = ['''^docs/api/.*\.md$''', '''^website-docs/.*\.md$''']
