name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "scripts/gofumpt-tree.sh"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "scripts/gofumpt-tree.sh"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # Not setup-go's cache: its key is derived from go.mod alone, so every
          # workflow that sets up Go for this module shares one key. Whichever
          # finishes first saves under it — DocReader, with a handful of
          # compiled packages — keys are immutable, and this job then restored
          # that and recompiled the whole test graph on every run (~8 of its
          # ~13 minutes). The caches below are this job's own.
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # The key ends in the run, so each push to main saves a fresh cache (a
      # build cache is only as useful as it is recent); a run restores the
      # newest one for the same go.sum, else the newest for this Go version.
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: app-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            app-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-
            app-go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Download modules
        run: go mod download

      # The whole tree, not only the files this change touches: a file left
      # unformatted by one commit would otherwise fail the next commit that
      # happens to edit it. scripts/gofumpt-tree.sh is what `make fmt-check`
      # runs, and pins the gofumpt that golangci-lint embeds, so this job, the
      # lint job and a developer's `make fmt` agree.
      - name: Check formatting (gofumpt, whole tree)
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          scripts/gofumpt-tree.sh check

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          # -count=1: never a cached pass; -shuffle=on: an order dependency
          # between tests fails here instead of on someone's machine (the seed
          # is printed, so a failure can be replayed with -shuffle=<seed>).
          go test -count=1 -shuffle=on "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server

      # Saved from main only: a pull request's cache is visible to that pull
      # request alone. Saved when tests fail too — the compiled packages are
      # just as reusable — but not for a cancelled run.
      - name: Save Go caches
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: app-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Advisory: a new vulnerability in a dependency appears without any commit of
  # ours, so this must never block a merge. It reports what the binary
  # actually reaches; read the log when it is red.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Scan the server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          scripts/govulncheck.sh
