name: License

# Yuheng incorporates upstream code under the MIT License (see NOTICE), so the
# notice files are not decoration: the MIT grant this repository relies on is
# conditioned on them travelling with the code. This workflow fails the build if one is deleted or hollowed out, and
# again if a dependency shows up under a license we cannot ship under MIT.
#
# The attribution half runs on every change, because a stray sed can strip a
# copyright header from any file. The dependency half resolves the module and
# package caches first, scans them, and also fails when THIRD_PARTY_NOTICES.md
# no longer matches the scan: its per-ecosystem lists are generated, so a
# dependency change must land together with `tools/license_check.sh notices`.
# Each job checks only the sections it can scan -- Go and both npm trees here,
# each Python project in its own job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: Attribution files intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The residual-brand scan uses `git grep`, which needs the work tree
          # only, but a shallow clone is enough and keeps the job fast.
          fetch-depth: 1
      - name: Check notices, copyright headers and brand residue
        run: tools/license_check.sh attribution

  dependencies:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            collab/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Populate the Go module cache
        run: |
          go mod download
          (cd cli && go mod download)
          (cd client && go mod download)

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # The collaboration service is its own npm tree and its own image; without
      # this install its section of the notices would go unchecked.
      - name: Install collab dependencies
        working-directory: collab
        run: npm ci --ignore-scripts

      - name: Scan dependency licenses and check the notices
        run: tools/license_check.sh deps go npm-frontend npm-collab

  docreader-dependencies:
    name: Dependency licenses (docreader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked fails if uv.lock is stale against pyproject.toml, and the sync
      # leaves the amd64 wheels in uv's cache for the scan below to reuse.
      - name: Sync docreader
        run: uv sync --project docreader --locked
      # The scan resolves the lock for the image's Python on linux/amd64 and
      # linux/arm64 (tools/licensescan/scan_python.py), not for this runner.
      - name: Scan dependency licenses and check the notices
        run: tools/license_check.sh deps python-docreader

  mcp-dependencies:
    name: Dependency licenses (mcp-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync mcp-server
        run: uv sync --project mcp-server --locked
      - name: Scan dependency licenses and check the notices
        run: tools/license_check.sh deps python-mcp-server
