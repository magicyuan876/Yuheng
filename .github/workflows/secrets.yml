name: Secrets

# Scans the full history for committed credentials, with the reviewed
# exceptions in .gitleaks.toml. A leaked key stays valid until it is rotated,
# so this runs on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the history
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml
