name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Node sizes its own heap from how much memory it thinks the machine has,
  # and on a runner that lands at about 2 GB — which this build no longer
  # fits into. It was never far under: minifying the editor's larger vendor
  # chunks is what costs the memory, and the build has been within a few
  # per cent of the ceiling for a while, passing or failing on which runner
  # it happened to get rather than on anything in the commit. Saying the
  # number out loud takes the runner's guess out of it.
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  verify:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Cheapest checks first, so a formatting slip fails in seconds rather
      # than after a two-minute build.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  # Advisory, like govulncheck in app.yml: advisories are published without any
  # commit of ours, so this reports and never blocks. Production dependencies
  # only; the build tooling does not ship.
  audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        run: npm audit --omit=dev
