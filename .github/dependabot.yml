# Dependabot configuration for the Yuheng repository.
#
# Policy: Dependabot opens NO pull requests on this repository. Changes land
# by direct commits to main, one developer, no PR review; a bot PR is only a
# second copy of work that has to be redone on main anyway (and Dependabot's
# own PRs miss the regenerated THIRD_PARTY_NOTICES.md, so they fail CI).
#
# How that is enforced, in two places:
#
#   * Repository settings (Settings -> Code security): "Dependabot alerts" is
#     ON, so a CVE in any lockfile still shows up under Security -> Dependabot
#     and by e-mail. "Dependabot security updates" is OFF -- that switch is
#     what opens security PRs, and this file cannot override it. It was
#     switched off on 2026-10-08 after it opened PRs #3-#5.
#
#   * This file: every ecosystem has version updates disabled, so no
#     scheduled bump PRs either. The pattern (mirrors the Dependabot docs on
#     "Disabling Dependabot version updates"):
#
#       open-pull-requests-limit: 0   # primary kill-switch for version PRs
#       ignore:                        # belt-and-suspenders: drop every
#         - dependency-name: "*"       # non-security update at the source.
#           update-types: [...]
#
#     Why both: dependabot-core#7353 shows `limit: 0` has historically been
#     ignored for some ecosystems; the wildcard `ignore` holds even then.
#
# Acting on an alert: upgrade on main (for an npm lockfile, `npm install
# pkg@^x`; for uv, `uvx --from uv@latest uv lock --upgrade-package pkg` --
# an old local uv downgrades the lockfile format), regenerate the notices
# with `tools/license_check.sh notices <section>`, commit. The alert closes
# itself once the default branch no longer carries the vulnerable version.
#
# The `groups: ... applies-to: security-updates` blocks below do nothing while
# security updates are off. They are kept so that switching the setting back
# on yields one grouped PR per ecosystem rather than one per package.
version: 2
updates:
  # ─── Go modules ───
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      server-security:
        applies-to: security-updates
        patterns: ["*"]

  # /cli used to take routine monthly version bumps. Paused while the project
  # is pre-release: the churn is not worth reviewing yet, and the security
  # lanes below are what actually matter. To bring it back, restore the entry
  # documented at the bottom of this file.
  - package-ecosystem: gomod
    directory: "/cli"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      cli-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/client"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      client-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── npm ───
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # The collaboration service is the only part of this repository that listens
  # on a socket of its own, so its transport dependencies (ws, @hocuspocus)
  # are the ones where a CVE matters most here.
  - package-ecosystem: npm
    directory: "/collab"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      collab-security:
        applies-to: security-updates
        patterns: ["*"]

  # The shared document definition, bundled into both the frontend and the
  # collaboration service.
  - package-ecosystem: npm
    directory: "/packages/docs-schema"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docs-schema-security:
        applies-to: security-updates
        patterns: ["*"]

  # Published to npm, so a vulnerable dependency here reaches other people's
  # machines rather than only this deployment.
  - package-ecosystem: npm
    directory: "/packages/dsh-yuheng"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      dsh-security:
        applies-to: security-updates
        patterns: ["*"]

  # Build-time only (the documentation site is static), but it is still built
  # in CI from these dependencies.
  - package-ecosystem: npm
    directory: "/website-docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      website-docs-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── Python ───
  - package-ecosystem: pip
    directory: "/docreader"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docreader-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── GitHub Actions ───
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      gha-security:
        applies-to: security-updates
        patterns: ["*"]

