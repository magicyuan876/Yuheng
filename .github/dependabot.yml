# Dependabot configuration for the Yuheng repository.
#
# Policy: EVERY ecosystem is security-only. No scheduled version PRs are
# opened for anything -- not the server module, not /cli, not any of the five
# npm workspaces, not docreader, not the actions. A CVE still opens a PR,
# grouped into one per ecosystem.
#
# READ THIS BEFORE TRUSTING THE FILE: none of it does anything until
# "Dependabot alerts" and "Dependabot security updates" are switched on in
# Settings -> Code security. Both are currently OFF, so Dependabot opens
# nothing at all on this repository. That is deliberate for now -- the project
# is pre-release and has never been tagged -- but it means there is no
# automated CVE warning either. Turning both on is the single action that
# activates everything below.
#
# Security-only pattern (mirrors fluent/fluentd-kubernetes-daemonset and
# the dependabot docs for "Disabling Dependabot version updates"):
#
#     open-pull-requests-limit: 0   # primary kill-switch for version PRs
#     ignore:                        # belt-and-suspenders: drop every
#       - dependency-name: "*"       # non-security update at the source.
#         update-types: ["version-update"]
#     groups:                        # collapse simultaneous CVE PRs into
#       security-updates:            # ONE PR per ecosystem so a noisy
#         applies-to: security-updates
#         patterns: ["*"]
#
# Why both `open-pull-requests-limit: 0` AND `ignore`:
#   The official docs treat `limit: 0` as the canonical way to disable
#   version updates, but dependabot-core#7353 shows it has historically
#   been ignored for some ecosystems. Adding the wildcard `ignore` rule
#   guarantees zero scheduled version PRs even if the limit gets
#   regressed upstream. Security updates are unaffected by either knob.
#
# Prerequisite: "Dependabot security updates" must be enabled in
#   Settings → Code security and analysis. Without it, no CVE PRs are
#   opened regardless of this file.
#
# Conventions applied to `/cli`:
#   * Monthly schedule (one batch / month).
#   * Two groups so per-dep PRs never flood:
#       - `cli-deps`        bundles minor + patch → ONE PR / month.
#       - `cli-deps-major`  bundles semver-major bumps the same way so
#                           breaking changes surface as a single
#                           review-required PR rather than silently
#                           accumulating.
#   * `open-pull-requests-limit: 3` as a safety net against stalled queues.
#   * `commit-message.prefix: "chore(deps)"` to match the repo's
#     Conventional Commits convention.
version: 2
updates:
  # ─── Go modules ───
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      server-security:
        applies-to: security-updates
        patterns: ["*"]

  # /cli used to take routine monthly version bumps. Paused while the project
  # is pre-release: the churn is not worth reviewing yet, and the security
  # lanes below are what actually matter. To bring it back, restore the entry
  # documented at the bottom of this file.
  - package-ecosystem: gomod
    directory: "/cli"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      cli-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/client"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      client-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── npm ───
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # The collaboration service is the only part of this repository that listens
  # on a socket of its own, so its transport dependencies (ws, @hocuspocus)
  # are the ones where a CVE matters most here.
  - package-ecosystem: npm
    directory: "/collab"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      collab-security:
        applies-to: security-updates
        patterns: ["*"]

  # The shared document definition, bundled into both the frontend and the
  # collaboration service.
  - package-ecosystem: npm
    directory: "/packages/docs-schema"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docs-schema-security:
        applies-to: security-updates
        patterns: ["*"]

  # Published to npm, so a vulnerable dependency here reaches other people's
  # machines rather than only this deployment.
  - package-ecosystem: npm
    directory: "/packages/dsh-yuheng"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      dsh-security:
        applies-to: security-updates
        patterns: ["*"]

  # Build-time only (the documentation site is static), but it is still built
  # in CI from these dependencies.
  - package-ecosystem: npm
    directory: "/website-docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      website-docs-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── Python ───
  - package-ecosystem: pip
    directory: "/docreader"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docreader-security:
        applies-to: security-updates
        patterns: ["*"]

  # ─── GitHub Actions ───
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      gha-security:
        applies-to: security-updates
        patterns: ["*"]

